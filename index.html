<!DOCTYPE html>
<html>
<head>
  <title>AI BTC Sentinel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: black;
      color: white;
      text-align: center;
      padding-top: 60px;
    }

    h1 {
      font-size: 52px;
      background: linear-gradient(90deg, #b44cff, #00d4ff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .card {
      margin: 40px auto;
      padding: 35px;
      width: 420px;
      border-radius: 22px;
      background: #0d0d14;
      box-shadow: 0 0 35px #8b4cff66;
    }

    .status {
      font-size: 44px;
      margin: 25px;
      color: #b44cff;
      font-weight: bold;
    }

    button {
      padding: 15px 25px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #b44cff, #00d4ff);
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .small {
      color: #777;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>AI BTC SENTINEL</h1>
  <p>Powered by GenLayer AI</p>

  <div class="card">

    <div>Current Signal</div>
    <div class="status" id="signal">WAIT</div>

    <button onclick="runBot()">RUN AI CHECK</button>
    <button onclick="getSignal()">GET SIGNAL</button>

    <div class="small">
      Contract: 0x650BCb1A0fa0cb57122338BAa07eac0F98EEf460
    </div>

  </div>

<script>
function runBot() {
  alert("Go to GenLayer Studio → click RUN on your contract");
}

function getSignal() {
  let result = prompt("Enter result from GenLayer (BUY / SELL / HOLD / WAIT)");
  
  if(result){
    document.getElementById("signal").innerText = result;
  }
}
</script>

</body>
</html>
