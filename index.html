<!DOCTYPE html>
<html>
<head>
  <title>AI BTC Sentinel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at left, #371064, #020204 45%),
                  radial-gradient(circle at right, #003b66, #020204 45%);
      color: white;
      text-align: center;
      min-height: 100vh;
      padding-top: 60px;
    }

    .logo {
      font-size: 14px;
      color: #aaa;
      letter-spacing: 4px;
    }

    h1 {
      font-size: 64px;
      margin: 20px 0 10px;
      background: linear-gradient(90deg, #c44cff, #00d4ff);
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: 3px;
    }

    .subtitle {
      color: #aaa;
      font-size: 18px;
    }

    .card {
      margin: 50px auto 25px;
      padding: 40px;
      width: 520px;
      max-width: 90%;
      border-radius: 28px;
      background: rgba(10, 10, 18, 0.88);
      border: 1px solid #2b2b44;
      box-shadow: 0 0 45px #7b2cff77;
    }

    .label {
      color: #aaa;
      letter-spacing: 2px;
      font-size: 13px;
    }

    .status {
      font-size: 58px;
      margin: 25px 0;
      font-weight: 900;
      color: #b44cff;
    }

    .buy { color: #00ff99; text-shadow: 0 0 25px #00ff99; }
    .sell { color: #ff3355; text-shadow: 0 0 25px #ff3355; }
    .hold { color: #ffd84d; text-shadow: 0 0 25px #ffd84d; }
    .wait { color: #b44cff; text-shadow: 0 0 25px #b44cff; }

    button {
      padding: 16px 28px;
      margin: 10px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #b44cff, #00d4ff);
      color: white;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
    }

    button:hover {
      transform: scale(1.04);
    }

    .info {
      margin: 25px auto;
      width: 620px;
      max-width: 90%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .box {
      background: rgba(255,255,255,0.05);
      border: 1px solid #252542;
      border-radius: 18px;
      padding: 18px;
      color: #bbb;
      font-size: 13px;
    }

    .contract {
      margin-top: 25px;
      color: #777;
      font-size: 13px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <div class="logo">GENLAYER AI CONSENSUS</div>

  <h1>AI BTC SENTINEL</h1>
  <div class="subtitle">Bitcoin signals powered by GenLayer Intelligent Contracts</div>

  <div class="card">
    <div class="label">CURRENT SIGNAL</div>

    <div class="status wait" id="signal">WAIT</div>

    <button onclick="runBot()">RUN AI CHECK</button>
    <button onclick="getSignal()">GET SIGNAL</button>

    <div class="contract">
      Contract: 0x650BCb1A0fa0cb57122338BAa07eac0F98EEf460
    </div>
  </div>

  <div class="info">
    <div class="box">AI Consensus<br><b>Verified</b></div>
    <div class="box">Verdict<br><b>Stored Onchain</b></div>
    <div class="box">Network<br><b>GenLayer</b></div>
  </div>

<script>
function setSignal(value) {
  const signal = document.getElementById("signal");
  const result = value.toUpperCase();

  signal.innerText = result;
  signal.className = "status";

  if (result === "BUY") signal.classList.add("buy");
  else if (result === "SELL") signal.classList.add("sell");
  else if (result === "HOLD") signal.classList.add("hold");
  else signal.classList.add("wait");
}

function runBot() {
  alert("Go to GenLayer Studio → click run → Send Transaction → wait FINALIZED");
}

function getSignal() {
  const result = prompt("Enter result from GenLayer: BUY / SELL / HOLD / WAIT");
  if (result) setSignal(result);
}
</script>

</body>
</html>
