<!DOCTYPE html>
<html>
<head>
  <title>AI BTC Sentinel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: black;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 50px;
      background: linear-gradient(90deg, #9b5cff, #00d4ff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .card {
      margin: 40px auto;
      padding: 30px;
      width: 400px;
      border-radius: 20px;
      background: #111;
      box-shadow: 0 0 20px #9b5cff44;
    }

    .status {
      font-size: 40px;
      margin: 20px;
      color: #9b5cff;
    }

    button {
      padding: 15px 25px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #9b5cff, #00d4ff);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>AI BTC SENTINEL</h1>
<p>Powered by GenLayer AI Consensus</p>

<div class="card">

  <div>Current Signal</div>
  <div class="status">WAIT</div>

  <button>RUN AI CHECK</button>
  <button>GET SIGNAL</button>

</div>

</body>
</html>
